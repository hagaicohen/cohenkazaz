<a class="skip-link" href="#main-content">דלג לתוכן הראשי</a>

<app-navbar [activeSection]="currentSection" (sectionChange)="onSectionChange($event)"></app-navbar>

<main id="main-content" class="site-main" tabindex="-1">
  <ng-container *ngIf="!isMobile()">
    <section *ngIf="currentSection === 'home'" class="fade-in home-section">
      <app-home (navigate)="onSectionChange($event)"></app-home>
    </section>

    <div *ngIf="currentSection !== 'home'" class="page-shell">
      <div class="cover-image"></div>
      <section *ngIf="currentSection === 'about'" class="fade-in">
        <app-about></app-about>
      </section>
      <section *ngIf="currentSection === 'services'" class="fade-in">
        <app-services></app-services>
      </section>
      <section *ngIf="currentSection === 'contact'" class="fade-in">
        <app-contact></app-contact>
      </section>
    </div>
  </ng-container>

  <ng-container *ngIf="isMobile()">
    <section id="home" #homeSection class="home-section">
      <app-home (navigate)="onSectionChange($event)"></app-home>
    </section>
    <div class="page-shell">
      <section id="about" #aboutSection>
        <app-about></app-about>
      </section>
      <section id="services" #servicesSection>
        <app-services></app-services>
      </section>
      <section id="contact" #contactSection>
        <app-contact></app-contact>
      </section>
    </div>
  </ng-container>
</main>
