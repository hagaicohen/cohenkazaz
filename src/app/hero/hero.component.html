<div class="hero" dir="rtl">
  <picture>
    <source media="(max-width: 768px)" type="image/webp" srcset="assets/images/hero-team-mobile.webp">
    <source media="(max-width: 768px)" srcset="assets/images/hero-team-mobile.jpg">
    <source type="image/webp" srcset="assets/images/hero-team-desktop.webp">
    <img class="hero-img" src="assets/images/hero-team-desktop.jpg"
         alt="עו״ד חגי כהן ועו״ד עפרה קזז במשרד כהן־קזז ושות׳" width="1759" height="894">
  </picture>
  <div class="hero-shade" aria-hidden="true"></div>

  <div class="hero-content">
    <h1 class="hero-title">
      ליווי משפטי מקצועי ואישי<span class="visually-hidden"> – עורכי דין ומגשרים מוסמכים במקרקעין ובדיני משפחה</span>
    </h1>

    <ul class="hero-areas" aria-label="תחומי התמחות">
      <li>מקרקעין</li>
      <li>דיני משפחה וירושה</li>
      <li>גישור</li>
    </ul>

    <div class="hero-actions">
      <a class="ck-btn ck-btn--gold" href="/contact" (click)="go('contact', $event)">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 10h18"></path>
        </svg>
        לתיאום פגישה
      </a>
      <a class="ck-btn ck-btn--ghost" href="tel:+972526706744" aria-label="יצירת קשר בטלפון 052-670-6744">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"></path>
        </svg>
        יצירת קשר
      </a>
    </div>
  </div>
</div>
